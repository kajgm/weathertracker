# Default-deny for the namespace. The pod only serves static files: the
# browser (not the pod) calls Open-Meteo and Iconify, so no egress is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: weathertracker
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
# Only the Cloudflare tunnel may reach nginx. Port is the pod's targetPort
# (8080), which is what Cilium enforces after service translation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
  namespace: weathertracker
spec:
  podSelector:
    matchLabels:
      app: weathertracker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
      ports:
        - protocol: TCP
          port: 8080
